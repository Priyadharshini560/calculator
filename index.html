
<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2f8;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px #aaa;
        }

        h2 {
            color: #2c3e50;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 65px;
            padding: 12px;
            margin: 5px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }

        button:hover {
            background: #217dbb;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Simple Calculator</h2>

    <input type="number" id="num1" placeholder="Enter first number">

    <input type="number" id="num2" placeholder="Enter second number">

    <div>
        <button onclick="add()">+</button>
        <button onclick="subtract()">-</button>
        <button onclick="multiply()">*</button>
        <button onclick="divide()">/</button>
    </div>

    <p id="result">Result will appear here</p>

</div>

<script>

function getNumbers() {

    let a = document.getElementById("num1").value;
    let b = document.getElementById("num2").value;

    if (a.trim() === "" || b.trim() === "") {
        showResult("Please enter both numbers");
        return null;
    }

    let num1 = Number(a);
    let num2 = Number(b);

    if (!Number.isFinite(num1) || !Number.isFinite(num2)) {
        showResult("Please enter valid numbers");
        return null;
    }

    return [num1, num2];
}

function showResult(message) {
    document.getElementById("result").textContent = message;
}

function add() {
    let nums = getNumbers();
    if (nums === null) return;

    showResult("Result: " + (nums[0] + nums[1]));
}

function subtract() {
    let nums = getNumbers();
    if (nums === null) return;

    showResult("Result: " + (nums[0] - nums[1]));
}

function multiply() {
    let nums = getNumbers();
    if (nums === null) return;

    showResult("Result: " + (nums[0] * nums[1]));
}

function divide() {
    let nums = getNumbers();
    if (nums === null) return;

    if (nums[1] === 0) {
        showResult("Cannot divide by zero");
        return;
    }

    showResult("Result: " + (nums[0] / nums[1]));
}

</script>

</body>
</html>
